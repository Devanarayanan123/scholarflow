services:
  - type: web
    name: scholarflow
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: scholarflow-data
      mountPath: /app/data
      sizeGB: 1
